manifestVersion: 1
id: clipboard-bridge
category: utilities
name: Clipboard Bridge
version: "1.0.11"
tagline: Share clipboard text and files across your devices
description: >-
  A private clipboard and file bridge with history, multiple accounts,
  Windows and Android clients and Apple Shortcuts support.
developer: Mattboxx
website: https://github.com/Mattboxx/Clipboard-Bridge
repo: https://github.com/Mattboxx/Clipboard-Bridge
support: https://github.com/Mattboxx/Clipboard-Bridge/issues
port: 5088
defaultPassword: $APP_PASSWORD
releaseNotes: GitHub and localized optional Ko-fi support are now visible at the top of the web page. Existing data mounts, accounts and Apple Shortcut URLs stay compatible.
submitter: Mattboxx
submission: https://github.com/Mattboxx/Clipboard-Bridge-AppStore
