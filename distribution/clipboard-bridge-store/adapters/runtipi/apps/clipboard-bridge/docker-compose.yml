services:
  clipboard-bridge:
    image: ghcr.io/mattbox03/clipboard-bridge-server:1.0.1
    restart: unless-stopped
    environment:
      CLIPBOARD_PORT: "5088"
      CLIPBOARD_DATA_DIR: /data
      CLIPBOARD_MAX_HISTORY: "200"
      CLIPBOARD_MAX_UPLOAD_MB: "64"
      CLIPBOARD_TOKEN: "${CLIPBOARD_TOKEN:-}"
      CLIPBOARD_PASSWORD: "${CLIPBOARD_PASSWORD:-}"
      CLIPBOARD_ACCOUNTS: "${CLIPBOARD_ACCOUNTS:-}"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5088/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    x-runtipi:
      is_main: true
      internal_port: 5088
x-runtipi:
  schema_version: 2
