services:
  clipboard-bridge:
    image: ghcr.io/mattboxx/clipboard-bridge-server:1.0.4
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5088}:5088"
    environment:
      CLIPBOARD_PORT: "5088"
      CLIPBOARD_DATA_DIR: /data
      CLIPBOARD_MAX_HISTORY: "${MAX_HISTORY:-200}"
      CLIPBOARD_MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-64}"
      CLIPBOARD_TOKEN: "${API_TOKEN:-}"
      CLIPBOARD_PASSWORD: "${WEB_PASSWORD:-}"
      CLIPBOARD_ACCOUNTS: "${ACCOUNTS:-}"
      CLIPBOARD_ACCOUNTS_FILE: "${ACCOUNTS_FILE:-}"
    volumes:
      - "${DATA_ROOT:-./data}:/data"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5088/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
