name: clipboard-bridge
services:
  clipboard-bridge:
    image: ghcr.io/mattboxx/clipboard-bridge-server:1.0.4
    container_name: clipboard-bridge
    restart: unless-stopped
    ports:
      - target: 5088
        published: "5088"
        protocol: tcp
    environment:
      CLIPBOARD_PORT: "5088"
      CLIPBOARD_DATA_DIR: /data
      CLIPBOARD_MAX_HISTORY: "${CLIPBOARD_MAX_HISTORY:-200}"
      CLIPBOARD_MAX_UPLOAD_MB: "${CLIPBOARD_MAX_UPLOAD_MB:-64}"
      CLIPBOARD_TOKEN: "${CLIPBOARD_TOKEN:-}"
      CLIPBOARD_PASSWORD: "${CLIPBOARD_PASSWORD:-}"
      CLIPBOARD_ACCOUNTS: "${CLIPBOARD_ACCOUNTS:-}"
    volumes:
      - /DATA/AppData/clipboard-bridge/data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5088/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
x-casaos:
  id: io.github.mattbox03.clipboard-bridge
  architectures:
    - amd64
    - arm64
  main: clipboard-bridge
  store_app_id: clipboard-bridge
  category: Utilities
  author: Mattboxx
  developer: Mattboxx
  icon: https://raw.githubusercontent.com/Mattboxx/Clipboard-Bridge-AppStore/main/Apps/ClipboardBridge/icon.svg
  port_map: "5088"
  scheme: http
  index: /
  title:
    en_US: Clipboard Bridge
    it_IT: Clipboard Bridge
  tagline:
    en_US: Share text and files between Windows, iPhone and your server.
    it_IT: Condividi testo e file tra Windows, iPhone e il tuo server.
  description:
    en_US: A private clipboard and file bridge with history, multiple accounts and iPhone Shortcuts support.
    it_IT: Un ponte privato per clipboard e file con cronologia, account multipli e supporto Comandi Rapidi iPhone.
  thumbnail: ""
  tips:
    before_install:
      en_US: Set a web password and API token if the service is reachable by untrusted devices.
      it_IT: Imposta password web e token API se il servizio è raggiungibile da dispositivi non fidati.
  version: "1.0.4"
  update_at: "2026-07-30"
  website: https://github.com/Mattboxx/Clipboard-Bridge
  repo: https://github.com/Mattboxx/Clipboard-Bridge
  support: https://github.com/Mattboxx/Clipboard-Bridge/issues
  docs: https://github.com/Mattboxx/Clipboard-Bridge/blob/main/GUIDE.md
