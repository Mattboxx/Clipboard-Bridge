name: Validate catalog
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      - run: python scripts/validate_catalog.py
      - run: docker compose -f compose.yaml config
      - run: WEBUI_PORT=5088 docker compose -f Apps/clipboard-bridge/docker-compose.yml config
      - run: APP_DATA_DIR=/tmp/clipboard-bridge APP_PASSWORD=test docker compose -f adapters/umbrel/clipboard-bridge/docker-compose.yml config
      - run: APP_DATA_DIR=/tmp/clipboard-bridge docker compose -f adapters/runtipi/apps/clipboard-bridge/docker-compose.yml config

