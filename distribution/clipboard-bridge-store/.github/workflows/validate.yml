name: Validate Docker App Catalog
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      - run: python scripts/validate_catalog.py
      - run: docker compose -f compose.yaml config
      - run: docker compose -f Apps/ClipboardBridge/docker-compose.yml config
      - run: APP_DATA_DIR=/tmp/clipboard-bridge docker compose -f adapters/runtipi/apps/clipboard-bridge/docker-compose.yml config
      - name: Validate ZimaOS metadata contract
        run: |
          docker compose -f Apps/ClipboardBridge/docker-compose.yml config --format json > /tmp/clipboard-bridge-compose.json
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          compose = json.loads(Path("/tmp/clipboard-bridge-compose.json").read_text())
          metadata = compose.get("x-casaos", {})
          assert re.fullmatch(r"[a-z0-9_-]+", compose.get("name", ""))
          assert metadata.get("id") == "io.github.mattbox03.clipboard-bridge"
          assert metadata.get("main") in compose.get("services", {})
          assert metadata.get("store_app_id") == compose["name"]
          assert metadata.get("port_map") == "5088"
          assert metadata.get("title", {}).get("en_US")
          for filename in ("featured-apps.json", "recommend-list.json"):
              entries = json.loads(Path(filename).read_text())
              assert all(item.get("appid") == compose["name"] for item in entries)
          print("ZimaOS metadata: OK")
          PY
      - name: Verify public multi-architecture image
        run: docker manifest inspect ghcr.io/mattboxx/clipboard-bridge-server:1.0.4 >/dev/null
