name: Feature request
description: Suggest a new feature, platform, or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Check existing issues first. Do not include credentials, private URLs, or clipboard contents.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain the user problem rather than only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Windows client
        - Docker/Python server
        - Android app
        - Apple Shortcuts (iPhone, iPad, Mac)
        - Web interface
        - Documentation
        - App Store package
        - New platform (e.g. Linux)
        - Other or multiple components
    validations:
      required: true
