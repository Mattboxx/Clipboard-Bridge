name: Build Windows ARM64

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-arm64.yml"
      - "packaging/windows/**"
      - "scripts/release_metadata.py"
      - "clipboard_bridge_windows.py"
      - "clipboard_text.py"
      - "clipboard_storage.py"
      - "clipboard_updates.py"
      - "clipboard_design.py"
      - "tests/test_updates.py"
      - "scripts/verify_windows_update.py"
      - "tests/test_clipboard_text.py"
      - "tests/test_clipboard_storage.py"
      - "requirements-client.txt"
      - "requirements-build.txt"
      - "scripts/verify_windows_build.py"
      - "tests/test_windows_client.py"
      - "tests/test_windows_design.py"
      - "tests/windows_clipboard_worker.py"
      - "VERSION"

permissions:
  contents: read

jobs:
  build:
    name: Native Windows ARM64
    runs-on: windows-11-arm
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up native ARM64 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          architecture: arm64

      - name: Install native build and test dependencies
        run: |
          python -c "import platform; assert platform.machine().lower() == 'arm64', platform.machine()"
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements-client.txt -r requirements-build.txt pytest
          if ($LASTEXITCODE -ne 0) { throw 'Native dependencies could not be installed' }

      - name: Test Windows client on ARM64
        run: |
          python -m pytest -q tests/test_windows_client.py tests/test_windows_design.py tests/test_updates.py tests/test_clipboard_text.py tests/test_clipboard_storage.py tests/test_release_metadata.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows ARM64 tests failed' }

      - name: Build native portable client
        run: |
          python scripts/release_metadata.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata is inconsistent' }
          python -m PyInstaller --noconfirm --clean --icon icon.ico --name "Clipboard Bridge" --version-file packaging/windows/windows_version_info.txt --add-data "icon.ico;." --add-data "VERSION;." --hidden-import pystray._win32 --collect-submodules keyboard --copy-metadata striprtf --collect-all pypdfium2_raw --collect-data pypdfium2 --copy-metadata pypdfium2 --exclude-module numpy --onefile --windowed clipboard_bridge_windows.py
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed' }
          python scripts/verify_windows_build.py "dist/Clipboard Bridge.exe" --architecture arm64 --smoke
          if ($LASTEXITCODE -ne 0) { throw 'Native portable verification failed' }
          $version = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Path Output/arm64 -Force | Out-Null
          Copy-Item -LiteralPath 'dist/Clipboard Bridge.exe' -Destination "Output/arm64/Clipboard.Bridge.Portable.Windows.arm64.V$version.exe"

      - name: Install Inno Setup compiler
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }

      - name: Build and verify ARM64 installer
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          $version = (Get-Content VERSION -Raw).Trim()
          & $compiler "/DMyAppVersion=$version" /DMyAppArchitecture=arm64 /OOutput/arm64 packaging/windows/Clipboard_Bridge_setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          $setup = (Resolve-Path "Output/arm64/Clipboard.Bridge_windows_client_and_server_setup_arm64_V$version.exe").Path
          $destination = Join-Path $env:RUNNER_TEMP 'clipboard-arm64-install'
          $data = Join-Path $env:LOCALAPPDATA 'Clipboard Bridge'
          New-Item -ItemType Directory -Path $data -Force | Out-Null
          $config = Join-Path $data 'config.json'
          '{"lang":"it","appearance":"dark","mode":"client"}' | Set-Content -LiteralPath $config
          $before = (Get-FileHash -LiteralPath $config).Hash
          $installer = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$destination`"" -WindowStyle Hidden -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer failed: $($installer.ExitCode)" }
          if ((Get-FileHash -LiteralPath $config).Hash -ne $before) { throw 'Installer overwrote the configuration' }
          $installed = Join-Path $destination 'Clipboard Bridge.exe'
          if ((Get-FileHash -LiteralPath $installed).Hash -ne (Get-FileHash -LiteralPath 'dist/Clipboard Bridge.exe').Hash) { throw 'Installer payload mismatch' }
          python scripts/verify_windows_build.py "$installed" --architecture arm64 --smoke
          if ($LASTEXITCODE -ne 0) { throw 'Installed ARM64 client verification failed' }
          Get-ChildItem Output/arm64/*.exe | Get-FileHash -Algorithm SHA256 | Format-Table

      - name: Verify frozen portable and installer update from previous public release
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          python scripts/verify_windows_update.py "dist/Clipboard Bridge.exe" "Output/arm64/Clipboard.Bridge_windows_client_and_server_setup_arm64_V$version.exe" --architecture arm64
          if ($LASTEXITCODE -ne 0) { throw 'Frozen ARM64 updater verification failed' }

      - name: Upload verified Windows ARM64 executables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clipboard-bridge-windows-arm64
          path: Output/arm64/*.exe
          if-no-files-found: error
          retention-days: 14
