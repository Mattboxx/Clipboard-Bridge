name: Build Windows x64

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-x64.yml"
      - "scripts/windows/**"
      - "scripts/prepare_release_assets.py"
      - "scripts/release_metadata.py"
      - "scripts/verify_windows_build.py"
      - "packaging/windows/**"
      - "clipboard_bridge_windows.py"
      - "clipboard_text.py"
      - "clipboard_storage.py"
      - "clipboard_updates.py"
      - "tests/test_updates.py"
      - "scripts/verify_windows_update.py"
      - "requirements-client.txt"
      - "requirements-build.txt"
      - "tests/test_windows_client.py"
      - "tests/windows_clipboard_worker.py"
      - "tests/test_clipboard_text.py"
      - "tests/test_clipboard_storage.py"
      - "tests/test_release_assets.py"
      - "tests/test_release_metadata.py"
      - "Iphone Shortcuts/**"
      - "VERSION"

permissions:
  contents: read

jobs:
  build:
    name: Native Windows x64
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up native x64 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install native build and test dependencies
        run: |
          python -c "import sysconfig; assert sysconfig.get_platform() == 'win-amd64'"
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements-client.txt -r requirements-build.txt pytest
          if ($LASTEXITCODE -ne 0) { throw 'Native dependencies could not be installed' }

      - name: Test Windows client and release preparation
        run: |
          python -m pytest -q tests/test_windows_client.py tests/test_updates.py tests/test_clipboard_text.py tests/test_clipboard_storage.py tests/test_release_assets.py tests/test_release_metadata.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows x64 tests failed' }

      - name: Install Inno Setup compiler
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }

      - name: Build with the actual x64 release script
        run: |
          $env:PYTHON_EXE = (Get-Command python).Source
          New-Item -ItemType Directory -Path Output -Force | Out-Null
          cmd /d /c scripts\windows\build_release.bat 2>&1 | Tee-Object -FilePath Output/x64-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows x64 release build failed' }
          python scripts/release_metadata.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata is inconsistent' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Build dependencies are inconsistent' }

      - name: Verify native portable payload and behavior
        run: |
          python scripts/verify_windows_build.py "dist/Clipboard Bridge.exe" --architecture x64 --smoke
          if ($LASTEXITCODE -ne 0) { throw 'Native portable verification failed' }

      - name: Install on the disposable runner and verify configuration preservation
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $setup = (Resolve-Path "Output/Clipboard.Bridge_windows_client_and_server_setup_x64_V$version.exe").Path
          $destination = Join-Path $env:RUNNER_TEMP 'clipboard-x64-install'
          $data = Join-Path $env:LOCALAPPDATA 'Clipboard Bridge'
          if (Test-Path -LiteralPath $data) { throw 'Unexpected existing app profile; refusing to overwrite it' }
          $samples = @{
            'config.json' = '{"lang":"it","appearance":"dark","mode":"client"}'
            'local_history/local_history.json' = '[{"id":"public-sample"}]'
            'server_data/index.json' = '[{"id":"public-host-sample"}]'
            'server_data/items/sample.txt' = 'Public example; preserve this file.'
          }
          $hashes = @{}
          foreach ($name in $samples.Keys) {
            $path = Join-Path $data $name
            New-Item -ItemType Directory -Path (Split-Path $path) -Force | Out-Null
            $samples[$name] | Set-Content -LiteralPath $path
            $hashes[$name] = (Get-FileHash -LiteralPath $path).Hash
          }
          $installer = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$destination`"" -WindowStyle Hidden -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer failed: $($installer.ExitCode)" }
          foreach ($name in $hashes.Keys) {
            if ((Get-FileHash -LiteralPath (Join-Path $data $name)).Hash -ne $hashes[$name]) { throw "Installer changed $name" }
          }
          $installed = Join-Path $destination 'Clipboard Bridge.exe'
          if ((Get-FileHash -LiteralPath $installed).Hash -ne (Get-FileHash -LiteralPath 'dist/Clipboard Bridge.exe').Hash) { throw 'Installer payload mismatch' }
          python scripts/verify_windows_build.py "$installed" --architecture x64 --smoke
          if ($LASTEXITCODE -ne 0) { throw 'Installed x64 client verification failed' }

      - name: Verify frozen portable and installer update from previous public release
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          python scripts/verify_windows_update.py "dist/Clipboard Bridge.exe" "Output/Clipboard.Bridge_windows_client_and_server_setup_x64_V$version.exe" --architecture x64
          if ($LASTEXITCODE -ne 0) { throw 'Frozen x64 updater verification failed' }

      - name: Record verified artifacts and dependency versions
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Path Output/x64-verified -Force | Out-Null
          Copy-Item -LiteralPath "Output/Clipboard.Bridge.Portable.Windows.x64.V$version.exe","Output/Clipboard.Bridge_windows_client_and_server_setup_x64_V$version.exe" -Destination Output/x64-verified
          Get-ChildItem Output/x64-verified/*.exe | Sort-Object Name | ForEach-Object { "$((Get-FileHash -LiteralPath $_.FullName).Hash.ToLower())  $($_.Name)" } | Set-Content Output/x64-verified/SHA256SUMS.txt
          python -m pip list --format=json | Set-Content Output/x64-verified/build-dependencies.json
          if ($LASTEXITCODE -ne 0) { throw 'Could not record build dependencies' }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          $buildLog = Get-Content -LiteralPath Output/x64-build.log -Raw
          $engine = [regex]::Matches($buildLog, '(?m)^Compiler engine version: Inno Setup ([0-9]+(?:\.[0-9]+){2,3})\r?$')
          if ($engine.Count -ne 1 -or $engine[0].Groups[1].Value -notmatch '^[1-9]') { throw 'Could not identify the Inno Setup compiler version' }
          @{
            source_commit = (git rev-parse HEAD)
            workflow_commit = $env:GITHUB_SHA
            pull_request_head = $env:PR_HEAD_SHA
            workflow_run = $env:GITHUB_RUN_ID
            workflow_attempt = $env:GITHUB_RUN_ATTEMPT
            python = (python --version)
            inno_setup = $engine[0].Groups[1].Value
            inno_setup_sha256 = (Get-FileHash -LiteralPath $compiler -Algorithm SHA256).Hash.ToLower()
            architecture = 'x64'
            release_published = $false
          } | ConvertTo-Json | Set-Content Output/x64-verified/build-provenance.json
          Get-ChildItem Output/x64-verified/*.exe | ForEach-Object { Get-AuthenticodeSignature -LiteralPath $_.FullName } | Format-Table Status,Path

      - name: Upload verified development packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clipboard-bridge-windows-x64
          path: Output/x64-verified/
          if-no-files-found: error
          retention-days: 14
