name: Validate project

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-server.txt pytest

      - name: Compile Python sources
        run: |
          python -m py_compile clipboard_bridge-Server.py
          python -m py_compile clipboard_bridge_windows.py
          python -m py_compile clipboard_text.py
          python -m py_compile clipboard_storage.py
          python -m py_compile clipboard_updates.py
          python -m py_compile clipboard_design.py
          python -m py_compile scripts/release_metadata.py
          python -m py_compile scripts/prepare_release_assets.py

      - name: Validate release metadata
        run: python scripts/release_metadata.py --check

      - name: Test server API and public site
        run: python -m pytest -q tests/test_server.py tests/test_updates.py tests/test_clipboard_text.py tests/test_clipboard_storage.py tests/test_release_assets.py tests/test_release_metadata.py tests/test_site_seo.py tests/test_docker_docs.py

      - name: Validate Docker Compose files
        run: |
          cp .env.example .env
          docker compose -f compose.yaml config --quiet
          docker compose -f docker-compose.yml config --quiet

      - name: Validate third-party CasaOS submission package
        run: |
          python -m pip install -r distribution/submissions/casaos-2026-10-27/validation/requirements.txt
          python distribution/submissions/casaos-2026-10-27/validation/validate.py

      - name: Build server image
        run: docker build --tag clipboard-bridge-server:test .

      - name: Fetch previous stable server for upgrade verification
        run: docker pull ghcr.io/mattboxx/clipboard-bridge-server:1.0.10

      - name: Verify container persistence and transfer contracts
        env:
          CLIPBOARD_TEST_IMAGE: clipboard-bridge-server:test
          CLIPBOARD_TEST_PREVIOUS_IMAGE: ghcr.io/mattboxx/clipboard-bridge-server:1.0.10
        run: python -m pytest -q tests/test_container.py

  windows-client:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install client test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-client.txt -r requirements-server.txt pytest

      - name: Test Windows client and standalone server
        run: python -m pytest -q tests/test_windows_client.py tests/test_windows_design.py tests/test_updates.py tests/test_server.py tests/test_clipboard_text.py tests/test_clipboard_storage.py tests/test_release_assets.py

  android-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Test and build Android client
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug lintDebug

      - name: Upload Android verification reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-verification-reports
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/*.xml
            android/app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14
