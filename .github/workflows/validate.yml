name: Validate project

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-server.txt pytest

      - name: Compile Python sources
        run: |
          python -m py_compile clipboard_bridge-Server.py
          python -m py_compile clipboard_bridge_windows.py
          python -m py_compile scripts/release_metadata.py

      - name: Validate release metadata
        run: python scripts/release_metadata.py --check

      - name: Test server API
        run: python -m pytest -q tests/test_server.py tests/test_release_metadata.py

      - name: Validate Docker Compose files
        run: |
          cp .env.example .env
          docker compose -f compose.yaml config --quiet
          docker compose -f docker-compose.yml config --quiet

      - name: Build server image
        run: docker build --tag clipboard-bridge-server:test .

  windows-client:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install client test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-client.txt pytest

      - name: Test Windows client
        run: python -m pytest -q tests/test_windows_client.py

  android-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Test and build Android client
        run: ./gradlew testDebugUnitTest assembleDebug
