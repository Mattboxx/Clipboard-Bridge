name: Validate project

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-server.txt

      - name: Compile Python sources
        run: |
          python -m py_compile clipboard_bridge-Server.py
          python -m py_compile clipboard_bridge_windows.py

      - name: Validate Docker Compose files
        run: |
          cp .env.example .env
          docker compose -f compose.yaml config --quiet
          docker compose -f docker-compose.yml config --quiet

      - name: Build server image
        run: docker build --tag clipboard-bridge-server:test .

  windows-client:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install client test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-client.txt pytest

      - name: Test Windows client
        run: python -m pytest -q
