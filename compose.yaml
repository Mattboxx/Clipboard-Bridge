name: clipboard-bridge

services:
  clipboard-bridge:
    image: ${APP_IMAGE:-ghcr.io/mattbox03/clipboard-bridge-server:latest}
    container_name: clipboard-bridge
    hostname: clipboard-bridge
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5088}:5088"
    environment:
      CLIPBOARD_PORT: "5088"
      CLIPBOARD_DATA_DIR: /data
      CLIPBOARD_MAX_HISTORY: "${MAX_HISTORY:-200}"
      CLIPBOARD_TOKEN: "${API_TOKEN:-}"
      CLIPBOARD_PASSWORD: "${WEB_PASSWORD:-}"
      CLIPBOARD_ACCOUNTS: "${ACCOUNTS:-}"
      CLIPBOARD_ACCOUNTS_FILE: "${ACCOUNTS_FILE:-}"
    volumes:
      - "${DATA_ROOT:-./data}:/data"
    networks:
      - clipboard-bridge
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5088/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  clipboard-bridge:
    name: clipboard-bridge
